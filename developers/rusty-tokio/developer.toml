# Source of truth for the rusty-tokio developer. Target repos receive copies (see sync/).
# A developer writes code; unlike experts/, it is not read-only. It pairs with the
# read-only experts/rusty-tokio reviewer, which reviews every diff it makes.
name = "rusty-tokio"
version = 1
kind = "developer"
reviewer = "experts/rusty-tokio"
source = "Written from experts/rusty-tokio (interview, grounding) and its 2026-10-31 baseline"

[[prompt]]
file = "prompt.md"
kind = "claude-subagent"
target_repo = "Rusty-Mill/rusty_mill"
target_path = ".claude/agents/rusty-tokio-developer.md"

[[prompt]]
file = "codex.md"
kind = "codex"
target_repo = "Rusty-Mill/rusty_mill"
target_path = "docs/agents/developers/rusty-tokio-developer-codex.md"
