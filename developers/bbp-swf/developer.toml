# Source of truth for the bbp-swf developer. Target repos receive copies (see sync/).
# A developer writes code; unlike experts/, it is not read-only. It pairs with the
# read-only experts/bbp-swf reviewer, which reviews every diff it makes.
name = "bbp-swf"
version = 1
kind = "developer"
reviewer = "experts/bbp-swf"
source = "Written from experts/bbp-swf (interview, grounding) and its 2026-10-31 baseline"

[[prompt]]
file = "prompt.md"
kind = "claude-subagent"
target_repo = "Rusty-Mill/rusty_mill"
target_path = ".claude/agents/bbp-swf-developer.md"

[[prompt]]
file = "codex.md"
kind = "codex"
target_repo = "Rusty-Mill/rusty_mill"
target_path = "docs/agents/developers/bbp-swf-developer-codex.md"
