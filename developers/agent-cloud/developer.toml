# Source of truth for the agent-cloud developer. Target repos receive copies (see sync/).
# A developer writes code; unlike experts/, it is not read-only. It pairs with the
# read-only experts/agent-cloud reviewer, which reviews every diff it makes.
name = "agent-cloud"
version = 1
kind = "developer"
reviewer = "experts/agent-cloud"
source = "Written from experts/agent-cloud (interview, grounding) and its 2026-10-31 baseline"

[[prompt]]
file = "prompt.md"
kind = "claude-subagent"
target_repo = "baileyrd/agent_cloud"
target_path = ".claude/agents/agent-cloud-developer.md"

[[prompt]]
file = "codex.md"
kind = "codex"
target_repo = "baileyrd/agent_cloud"
target_path = "docs/agents/developers/agent-cloud-developer-codex.md"
