# Generated by `python3 -m bench suite pythrust`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": [
        "index.crates.io",
        "static.crates.io"
      ]
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "47-r1"
input    = "Review PR 47 of baileyrd/PythRust against base 5d76260eef62e1a3c7abfd48635a9a3e82a37650 at head e243a9a79786d8c10af0ce3fe2e4e5e1b9a12a67. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "e243a9a79786d8c10af0ce3fe2e4e5e1b9a12a67", base = "5d76260eef62e1a3c7abfd48635a9a3e82a37650", ref = "refs/pull/47/head" }
checks   = [
  { judge = "K1: A loose function forwarding its parameters bypasses the tempered call check\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nLoose forward(xs, ys) calls tempered push(mut xs, ys). The outer forward(a, a) is not\nchecked because forward is loose, and inside forward Param(0) and Param(1) start\ndisjoint (body.rs:119-121, 182-183; calls.rs:51-52), so push receives one list twice.\nParameter/global sharing passes through the same way.\nIt counts as caught if the review names a loose (or untempered) wrapper passing aliased arguments through to a tempered mut/owned call, with the wrapper's parameters assumed disjoint." },
]

[[case]]
id       = "48-r1"
input    = "Review PR 48 of baileyrd/PythRust against base 5d76260eef62e1a3c7abfd48635a9a3e82a37650 at head 4771160b650e6a50edeaf6bc48d244050a69f057. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "4771160b650e6a50edeaf6bc48d244050a69f057", base = "5d76260eef62e1a3c7abfd48635a9a3e82a37650", ref = "refs/pull/48/head" }
checks   = [
  { judge = "K1: Different tuple slots are assumed to hold different lists\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nalias.rs:449-453 treats Field(0) and Field(1) of a parameter as disjoint. A tempered\nf(mut pair: tuple[list[int], list[int]]) binds a = pair[0], b = pair[1], appends to a and\nreads len(b); f((xs, xs)) passes one list in both slots, so D4 misses the change. A5's\nper-call check cannot help because it is one argument.\nIt counts as caught if the review names two slots (or nested paths) of a tuple from outside the body being assumed disjoint, so a change through one is missed through the other." },
  { judge = "K2: An exception holding a list turns off aliasing checks for the whole program\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nown/mod.rs:105-108: lowering an exception built with a list argument hits a lowering gap,\nso the analysis falls back to Conservative and clears every alias diagnostic. A tempered\nescape(xs) that raises ValueError(xs) and returns xs is no longer rejected by D3. The\nreview called it an A6 completion blocker without a P grade.\nIt counts as caught if the review names the conservative fallback (lowering gap) silently dropping aliasing/D3/D4 diagnostics when a program constructs an exception from a list." },
]

[[case]]
id       = "48-r2"
input    = "Review PR 48 of baileyrd/PythRust against base 5d76260eef62e1a3c7abfd48635a9a3e82a37650 at head 2a09a304c45dcdd8f090a1751b81eca4944fe229. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of 4771160b; re-check each at this head:\n- K1 (P1): Different tuple slots are assumed to hold different lists\n- K2 (blocking): An exception holding a list turns off aliasing checks for the whole program"
checkout = { from = "${TARGET}", head = "2a09a304c45dcdd8f090a1751b81eca4944fe229", base = "5d76260eef62e1a3c7abfd48635a9a3e82a37650", ref = "refs/pull/48/head" }
checks   = [
  { judge = "K1: Different depths are assumed to be different lists\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nalias.rs:478-482 keys a location by depth. f(mut pair: tuple[list[int], list[list[int]]])\nbinds a = pair[0], b = pair[1][0], appends to a and reads len(b); f((xs, [xs])) puts one\nlist at depths 1 and 2, so the change is missed. The global xs = [1]; rows = [xs] has the\nsame hole at World depths 0 and 1.\nIt counts as caught if the review names one list reachable at two different depths (tuple slot or global) being treated as two lists." },
  { judge = "K2: A parameter and a global are assumed never to be the same list\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nalias.rs:470-472 keeps Param and World disjoint. With saved = [1], a tempered\nf(mut xs: list[int]) binds other = saved, appends to xs and reads other; f(saved) passes\nthe global as the parameter, so D4 misses it. A single argument means A5's pairwise\ncheck cannot catch it.\nIt counts as caught if the review names a parameter that may be a module variable (global) being treated as disjoint from it." },
]

[[case]]
id       = "65-r1"
input    = "Review PR 65 of baileyrd/PythRust against base 5de8b6027190a0d8ba0e857cad338d7813fe0bc4 at head 36dcec7f7e704b62e0d9f13d5800bc9e78c2180b. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "36dcec7f7e704b62e0d9f13d5800bc9e78c2180b", base = "5de8b6027190a0d8ba0e857cad338d7813fe0bc4", ref = "refs/pull/65/head" }
checks   = [
  { judge = "K1: A dict view does not carry the provenance of the lists it holds\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nbody.rs:326-328: elements_hold_list recognises only Compound::List, so Rvalue::View's\ndestination records no element origins. A tempered function taking d: dict[int, list[int]]\nwithout mut can take vs = d.values() and append to each value, and can return\nlist(d.values()) despite D3.\nIt counts as caught if the review names dict values/items views losing the ownership/alias provenance of their list elements, so mutation or return of a parameter's lists is missed." },
  { judge = "K2: get's default is evaluated only when the key is missing\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nlower/table.rs:221-225 lowers d.get(k, default_expr) with the default only on the miss\nbranch. Python and run evaluate every argument first, so with d = {1: 10},\nd.get(1, default()) skips default()'s prints, changes or exceptions natively.\nIt counts as caught if the review names the get default argument not being evaluated on a hit (evaluation order differs from CPython/run)." },
  { judge = "K3: KeyError carries the converted key instead of the key as written\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nlower/table.rs:137: a bool probing an int-keyed dict is converted to int before the\nKeyError is built, so catching d[True] on an empty dict[int, str] prints 1 natively where\nrun and CPython print True.\nIt counts as caught if the review names the native KeyError for a bool key of an int-keyed dict showing the int instead of True." },
]
