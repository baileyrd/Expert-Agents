# Generated by `python3 -m bench suite bbp-swf`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": [
        "index.crates.io",
        "static.crates.io"
      ]
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "763-r1"
input    = "Review PR 763 of Rusty-Mill/rusty_mill against base 5dbb633f9f2db1459002fc8fefee59eb4f9f2298 at head 2b31b4e637088adf15227f8b039a8981f6a6a3db. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "2b31b4e637088adf15227f8b039a8981f6a6a3db", base = "5dbb633f9f2db1459002fc8fefee59eb4f9f2298", ref = "refs/pull/763/head" }
checks   = [
  { judge = "K1: The build pin checks the evaluator, not each saved run's producer\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\npairs.rs:374-407 and 519-528 parse moderator output as ModOut { state_ms } and ignore\nthe emitted bbp_build_sha. Rebuilding the evaluator lets old, dirty, unknown or\nmixed-build runs pass as pinned. Each saved run's build identity must be required and\nmatched to the pinned checkout; missing, dirty, unknown and mismatched identities\nrejected.\nIt counts as caught if the review names that the pin/settings check validates the current (evaluating) binary's build sha rather than the build sha each saved run recorded, so runs from other or dirty builds pass." },
  { judge = "K2: build.rs reruns only on HEAD/index changes, so a dirty build keeps a clean BBP_BUILD_SHA\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nbuild.rs:22-29 rerun inputs watch git HEAD, the index and build.rs, not unstaged source\nchanges. Cargo rebuilds edited Rust code while keeping a previously clean\nBBP_BUILD_SHA; restoring the checkout leaves a dirty-built executable passing the pin.\nBranch/ref movement is also missed.\nIt counts as caught if the review names that the build-sha provenance is not recomputed when sources change without HEAD/index changing (unstaged edit, ref move), so a dirty build reports a clean sha." },
  { judge = "K3: check_settings accepts zero models, so result-only logs price at zero\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\npairs.rs:397-402,431-453 rejects only model sets of length > 1. Result-only usage logs\naccepted by tokens::parse produce empty model maps; matching empty arms pass and\nper-model cost becomes zero. Absent model evidence, including granted turns with no\nmodel observations, must be rejected.\nIt counts as caught if the review names that an empty model set (no model evidence in a run or turn) passes the same-model/settings check, letting arms match vacuously or cost price at zero." },
  { judge = "K4: A terminal task state returns success before the final cap check\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nmoderator.rs:337-357 returns success for Closed/Cancelled before enforce_cap. Over-cap\nor unpriced output written before the terminal poll is accepted. After stopping\nharnesses, final usage must be validated before a successful completion.\nIt counts as caught if the review names that reaching Closed/Cancelled exits the moderator loop successfully without validating the final usage against the cost cap (over-cap or unpriced output accepted)." },
]

[[case]]
id       = "763-r2"
input    = "Review PR 763 of Rusty-Mill/rusty_mill against base 5dbb633f9f2db1459002fc8fefee59eb4f9f2298 at head fa4a8a8a3bf8daff05ccb967d65ba9317b7e2aec. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of 2b31b4e6; re-check each at this head:\n- K1 (P1): The build pin checks the evaluator, not each saved run's producer\n- K2 (P1): build.rs reruns only on HEAD/index changes, so a dirty build keeps a clean BBP_BUILD_SHA\n- K3 (P2): check_settings accepts zero models, so result-only logs price at zero\n- K4 (P2): A terminal task state returns success before the final cap check"
checkout = { from = "${TARGET}", head = "fa4a8a8a3bf8daff05ccb967d65ba9317b7e2aec", base = "5dbb633f9f2db1459002fc8fefee59eb4f9f2298", ref = "refs/pull/763/head" }
checks   = [
  { judge = "K1: Two harness sessions in one turn log: only the last result is costed\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ntokens.rs:347-380 selects the last result line. Pins accepts two sequential pinned\nclaude commands (warmup; exec claude ...). Both write one turn log, so the first\nsession's spend is dropped from known cost and from the cap floor. Restrict evidence\nlaunchers to one session or account per session.\nIt counts as caught if the review names that a launcher running more than one harness session (sequential claude commands) has earlier sessions' cost lost because accounting takes only the last result." },
  { judge = "K2: Evidence marker is written before the moderator lock is taken\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nmoderator.rs:365-375 inspects/creates the evidence marker before acquiring the\nmoderator lock. An uncapped moderator holding the lock before its first grant lets a\nsecond, capped startup write the marker and then fail the lock, so the uncapped run is\nlater treated as evidence.\nIt counts as caught if the review names the ordering race: the evidence marker is checked or written before the moderator lock, so a refused concurrent capped startup can mark an uncapped run as evidence." },
  { judge = "K3: A shell-computed --tools value bypasses the no-subagent check\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\npins.rs:511-545: `t=Agent,Task; exec claude ... --tools \"$t\" -p task`. The checker reads\n$t as a literal tool name while the shell supplies Agent,Task; list_values discards\nArg.dynamic. Unresolved dynamic flag values must be rejected.\nIt counts as caught if the review names that a dynamic/computed shell value (variable or substitution) for a checked flag like --tools is treated as a literal, bypassing the subagent/tool restriction." },
  { judge = "K4: Unreadable or missing turn logs bypass the fail-closed cap\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ntokens.rs:634-642 skips failed read_to_string calls and only increments without_output;\nenforce_cap (moderator.rs:560-586) checks returned turns, never that counter. Missing\nterminal logs, permission failures and invalid UTF-8 escape cap validation.\nIt counts as caught if the review names that a turn log that fails to read (missing at end, permission error, invalid UTF-8) is silently skipped/counted as no output instead of failing the cap check." },
]

[[case]]
id       = "932-r1"
input    = "Review PR 932 of Rusty-Mill/rusty_mill against base 1703450af78b2c70ecd0c4b18f8fa5c3ec117235 at head e0137a43f74e089ac0bf241bcff62494cca47c77. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "e0137a43f74e089ac0bf241bcff62494cca47c77", base = "1703450af78b2c70ecd0c4b18f8fa5c3ec117235", ref = "refs/pull/932/head" }
checks   = [
  { judge = "K1: Requests queued before a grant act with the later grant's token\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nIn mcp.rs, wait overwrites the server-wide `shown` (464-469), later calls derive their\ntoken from that mutable value (563-583), and serve_on handles stdin requests serially\n(666-694). A post pipelined with wait before a grant, or an old inference's post queued\nbehind a next-turn wait, runs after wait returns and receives the new turn's token.\nEach request must be bound to the turn it was produced in, and stale queued calls\nrefused (spec: immutable invocation context; drop queued calls before a later grant).\nIt counts as caught if the review names that session calls take their turn/token from mutable server state set by wait, so a call produced or queued before a later grant executes with that later turn's authority." },
]

[[case]]
id       = "988-r1"
input    = "Review PR 988 of Rusty-Mill/rusty_mill against base 90ee60b9e7bdaccedd8c22c04e67e47b9d2900ab at head 54b9024e2b79bceccd09465005630256b531f6a4. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "54b9024e2b79bceccd09465005630256b531f6a4", base = "90ee60b9e7bdaccedd8c22c04e67e47b9d2900ab", ref = "refs/pull/988/head" }
checks   = [
  { judge = "K1: One member's write root can swap a symlink into another member's leased path\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nlease.rs bounded() prunes only against the current member's writes. A writes /src while\nB keeps read /src/sub; A replaces sub with a symlink to /secret before B launches, and\nthe Linux sandbox opens the root O_PATH and follows it. Pin root identity through launch\nor refuse such cross-member relationships.\nIt counts as caught if the review names a cross-member symlink swap: a path leased to one member lies under another member's write root, so it can be replaced by a symlink before launch and escape the lease." },
  { judge = "K2: Delegation compares lexical paths while the host grants canonicalized targets\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nfactory.rs covers() accepts child /src/escape under parent /src lexically, but the\nchild's confine() resolves escape to /secret and grants it if the static pool allows\nthat target, which parent /src would not. Parent-child authority and launch must use the\nsame canonical identity.\nIt counts as caught if the review names that the parent/child (delegation) containment check is lexical while confinement canonicalizes, so a symlink under the parent's path grants a child a target outside the parent's boundary." },
  { judge = "K3: Lease expiry is not a hard deadline: terminal drain gets a fresh grace\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\norch-bbp lib.rs lifetime() clamps max_wall, but the moderator's Closed/Cancelled path\ndrains harnesses with a fresh end_grace (default 60s) before checking wall expiry, and\nthe relative duration is computed before startup/health work. A harness keeps its\nauthority past the lease end. Carry an absolute deadline through startup, launch,\nsupervision and every cleanup grace.\nIt counts as caught if the review names that the lease end is enforced as a relative wall budget, so startup time or a terminal/cleanup grace lets a harness run past the lease expiry." },
]
