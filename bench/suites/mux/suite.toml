# Generated by `python3 -m bench suite mux`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": []
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "1251-r1"
input    = "Review PR 1251 of Rusty-Mill/rusty_mill against base d05170b8cc082cffaf6c348411e82bea84b9632d at head 55d4bbf92e2d5f8f1b12aa0ffeddf57775fe0375. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "55d4bbf92e2d5f8f1b12aa0ffeddf57775fe0375", base = "d05170b8cc082cffaf6c348411e82bea84b9632d", ref = "refs/pull/1251/head" }
checks   = [
  { judge = "K1: An idle resumed client's takeover token is never confirmed\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nstate.rs:158-162 keeps only the old confirmed token. A confirmed; takeover issues B; the\nidle client sends nothing; the next takeover presents B and gets C, whose Welcome is\nlost; the retry with B is refused because the stored tokens are C and A.\nIt counts as caught if the review names the presented-but-unconfirmed token and a lost Welcome leaving the retry refused." },
  { judge = "K2: The TUI keeps a hidden block's lease through the orphan grace\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nsync() drops panes that leave the visible set with hang_up alone, so the server keeps\nthe client and its lease for the 30 s grace. After another client zooms away and back,\nthe block's fresh client conflicts with its own orphan's lease.\nIt counts as caught if the review names a pane hidden by layout or zoom keeping its lease through the grace." },
]
