# Generated by `python3 -m bench.fix suite rusty-tokio-seeded`; edit the cases or prompt, not this.

samples       = 3
allowed_tools = ["Read", "Grep", "Glob", "Bash", "Edit", "Write"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Agent",
      "Read(/${EXPERT_AGENTS}/**)",
      "Edit(/${EXPERT_AGENTS}/**)",
      "Write(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Edit(/${TARGET}/**)",
      "Write(/${TARGET}/**)",
      "Read(~/.claude/**)",
      "Edit(~/.claude/**)",
      "Write(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": [
        "index.crates.io",
        "static.crates.io"
      ]
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "broadcast-close-wake"
input    = "Bug: in rusty_tokio, a task blocked in `broadcast::Receiver::recv()` never returns after\nthe last `Sender` is dropped. In one service the shutdown path hung instead of finishing.\n\nIf `recv()` is called after every sender is already gone it correctly returns\n`RecvError::Closed`; only a receiver that was already waiting is affected.\n\nExpected, as in tokio: dropping the last sender wakes every waiting receiver, and each gets\n`RecvError::Closed` once it has read what was buffered. Fix it in\n`crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 4b09612567ed416dac1bd079b9c82ae3eabefa2a; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "4b09612567ed416dac1bd079b9c82ae3eabefa2a" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "bufreader-bypass"
input    = "Bug: in rusty_tokio, `io::BufReader` loses data. After a small read leaves bytes in its\nbuffer, a following read into a buffer at least as large as the `BufReader`'s capacity\nskips the buffered bytes and returns later data.\n\nRepro: `BufReader::with_capacity(4, &b\"abcdefghij\"[..])`; `read_exact` one byte (gets\n`a`); then `read` into a 16-byte buffer returns `efghij`, and `bcd` is gone.\n\nExpected, as in tokio: bytes come out in order and none are lost, whatever the read\nsizes. Fix it in `crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 5e8991097d1fa863d90fbb3cb57059672e660344; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "5e8991097d1fa863d90fbb3cb57059672e660344" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "bufwriter-shutdown"
input    = "Bug: in rusty_tokio, data written through `io::BufWriter` or `io::BufStream` is lost if\nthe stream is shut down without an explicit `flush()`. The peer sees EOF without the\nbuffered bytes.\n\nRepro: wrap one half of `io::duplex(64)` in `BufWriter`, `write_all(b\"hello\")`, then\n`shutdown()`. `read_to_end` on the other half returns nothing.\n\nExpected, as in tokio: `shutdown()` writes out buffered data before shutting down the\ninner stream. Fix it in `crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 60608eb438297ccba7629c993b6f2e7150bb920c; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "60608eb438297ccba7629c993b6f2e7150bb920c" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "duplex-shutdown-eof"
input    = "Bug: in rusty_tokio, reading from an `io::duplex` stream can hang after the peer calls\n`shutdown()`. A task blocked in `read`/`read_to_end` on an empty pipe stays blocked when\nthe other half shuts down its write side.\n\nReads that start after the shutdown see EOF correctly, and dropping the other half\ninstead of shutting it down also wakes the reader.\n\nExpected, as in tokio: `shutdown()` on one half makes a pending read on the other half\nreturn EOF (`Ok(0)`) once the buffered bytes are drained. Fix it in\n`crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 7d184687053bfdb9a584642cc888b2b6e42b6588; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "7d184687053bfdb9a584642cc888b2b6e42b6588" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "interval-skip-boundary"
input    = "Bug: in rusty_tokio, `time::Interval` with `MissedTickBehavior::Skip` sometimes fires two\nticks back to back after a stall. When the caller falls behind by an exact multiple of the\nperiod (easy to hit under `time::pause()` and `time::advance`), the tick after the\ncatch-up tick completes immediately instead of waiting.\n\nRepro: `interval_at(start, 10s)` with Skip, tick once, advance 30s, tick (returns\n`start + 10s`), then tick again: it returns `start + 30s` at once.\n\nExpected, as in tokio: Skip schedules the next tick strictly in the future, on the\noriginal period grid (`start + 40s` here). Fix it in `crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 046884df83195efa92f41745d1142d411a1becab; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "046884df83195efa92f41745d1142d411a1becab" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "once-cell-cancel-waiters"
input    = "Bug: in rusty_tokio, `sync::OnceCell::get_or_init` can hang forever. If the task running\nthe initializer is aborted (or its future is dropped) while the initializer is pending,\nthe other tasks already waiting in `get_or_init` on the same cell never make progress.\n\nA `get_or_init` call made after the abort, with no one else waiting, works.\n\nExpected, as in tokio: when the running initializer is cancelled, one of the waiting\ncallers takes over and runs its own initializer, and the rest receive that value. Fix it\nin `crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at a3f11e44b0bec35faaebaf5009f074cc97b10bd9; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "a3f11e44b0bec35faaebaf5009f074cc97b10bd9" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "oneshot-rewaker"
input    = "Bug: in rusty_tokio, a `oneshot::Receiver` that is polled in one place and later awaited\nsomewhere else can hang forever even though the `Sender` sends a value.\n\nRepro: race `&mut rx` against `time::timeout` (or in a `select!` loop) so it is polled and\ntimes out, then move `rx` into a spawned task and `.await` it there. Send from another task.\nThe spawned task never wakes. Awaiting `rx` from a single place works.\n\nExpected, as in tokio: `send` wakes whichever task polled the receiver most recently, and\nthe await returns `Ok(value)`. Fix it in `crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 7376cef76d8782caca80bf09f3d21cc1ccbfee13; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "7376cef76d8782caca80bf09f3d21cc1ccbfee13" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "timeout-ready-first"
input    = "Bug: in rusty_tokio, `time::timeout` and `time::timeout_at` report `Err(Elapsed)` for a\nfuture that is already complete when the deadline has passed by the time it is polled.\n\nRepro: `timeout(Duration::ZERO, async { 5 }).await` returns `Err(Elapsed)`. Under paused\ntime, a future that becomes ready at the same instant as the deadline also loses.\n\nExpected, as in tokio: a future that can complete returns `Ok(value)`; `Elapsed` only\nwhen it is still pending at the deadline. Fix it in `crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 2013f6b828cb1b222922017c3dd1e3f8bee82ae9; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "2013f6b828cb1b222922017c3dd1e3f8bee82ae9" }
