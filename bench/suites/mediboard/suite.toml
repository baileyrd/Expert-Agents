# Generated by `python3 -m bench suite mediboard`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": [
        "pypi.org",
        "files.pythonhosted.org"
      ]
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "18-r1"
input    = "Review PR 18 of baileyrd/MediBoard against base 0fa26d7cd4b7f3b6459eb7a578528af73d764145 at head 27b56fe16d4cb560841e972e68ca3b4f798181e0. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "27b56fe16d4cb560841e972e68ca3b4f798181e0", base = "0fa26d7cd4b7f3b6459eb7a578528af73d764145", ref = "refs/pull/18/head" }
checks   = [
  { judge = "K1: Re-import reuses integer ids, so a stale review lands on a different measurement\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nhealth/ingest.py:60-62. A changed unreviewed day is deleted and reinserted, and SQLite\nreuses the freed integer ids. Synthetic day: heart_rate id 1, steps id 2; a re-import that\nadds body_mass (sorted first) gives it id 1, and a tab opened before the import PATCHes\nmeasurement/1 onto body_mass. The server-instance guard does not change during an import.\nIt counts as caught if the review names delete-and-reinsert (or id reuse) on re-import letting a review from an earlier page load apply to a different row." },
  { judge = "K2: Bare export.xml is not covered by the PHI guard or .gitignore\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nhealth/export.py:48-51 accepts a bare XML export, but .gitignore and phi_guard only\nprotect the zip. A root export.xml, or a localized name, can be committed.\nIt counts as caught if the review names a supported raw Health export format (XML) that .gitignore/phi_guard do not block." },
  { judge = "K3: physical_effort and insulin_delivery aggregation reversed\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ndomain/health.py:21-27,66-68 sums physical_effort as cumulative and averages\ninsulin_delivery as discrete. HealthKit defines the reverse.\nIt counts as caught if the review names physical_effort or insulin_delivery aggregated with the wrong kind (sum vs mean) against HealthKit." },
  { judge = "K4: Workout minutes count paused time\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nhealth/export.py:140-147 ignores duration/durationUnit and uses end - start, so a\npaused workout inflates exercise minutes.\nIt counts as caught if the review names workout duration taken from start/end instead of the exported duration and unit." },
  { judge = "K5: Change detection compares rounded text\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nhealth/ingest.py:51-54 compares day.text(), and domain/health.py:120-126 rounds values\nto 2 decimals, so 0.971 -> 0.974 is treated as unchanged and the new value is dropped.\nIt counts as caught if the review names re-import change detection on rounded display text missing a real value change." },
  { judge = "K6: BP readings truncated to HH:MM before dedup\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nhealth/export.py:137 reduces the timestamp to HH:MM before dedup at domain/health.py:166,\nmerging distinct equal readings in the same minute and dropping the UTC offset.\nIt counts as caught if the review names blood pressure timestamps truncated (minute or offset) so distinct readings merge or lose identity." },
]

[[case]]
id       = "3-r1"
input    = "Review PR 3 of baileyrd/MediBoard against base 866e4bd0c4cb65227c0da2e675ff931e6b6371d0 at head b9dcf05dc4eecaca7db8987355b44186f5128388. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "b9dcf05dc4eecaca7db8987355b44186f5128388", base = "866e4bd0c4cb65227c0da2e675ff931e6b6371d0", ref = "refs/pull/3/head" }
checks   = [
  { judge = "K1: unconfirmed_count and the evidence gate depart from the frozen contract\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ndomain/claim.py:154-157. _is_pending counts confirmed or corrected children of an\nunreviewed visit as pending and drops unreviewed children of a rejected visit, while\ncontract/api.md defines unconfirmed_count as the number of unreviewed items in the\ncategory. The claim view's count and its evidence gate disagree with the frozen contract\nwithout an amendment.\nIt counts as caught if the review names the claim count or review gate keying on the parent visit's status instead of the item's own status, contrary to contract/api.md's unconfirmed_count." },
]

[[case]]
id       = "5-r1"
input    = "Review PR 5 of baileyrd/MediBoard against base 866e4bd0c4cb65227c0da2e675ff931e6b6371d0 at head 0dd1eced4b32e416430e5cbbac5163f085c22ef7. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "0dd1eced4b32e416430e5cbbac5163f085c22ef7", base = "866e4bd0c4cb65227c0da2e675ff931e6b6371d0", ref = "refs/pull/5/head" }
checks   = [
  { judge = "K1: Model-written JSON keys reach schema errors and runner logs\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nextract/validate.py:30-31, runner.py:76. Unexpected keys in the model's JSON are copied\ninto the schema exception and the runner's warning. A key can carry record text, so PHI\nlands in logs and the jsonl error records.\nIt counts as caught if the review names model-controlled keys or values copied into validation errors, warnings or logs, leaking record text." },
  { judge = "K2: Multiline CONDITIONS MENTIONED summary is only stripped to the first newline\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nextract/page.py:15-17. The MULTILINE regex that removes the summary field stops at the\nfirst newline, so the listed conditions on later lines stay in the model input and can\npass quote grounding as if the page documented them.\nIt counts as caught if the review names the CONDITIONS MENTIONED (summary/decoy) strip leaving continuation lines in the model input." },
  { judge = "K3: Whitespace-only quote passes grounding\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nextract/validate.py:42-47. Normalizing a whitespace-only quote yields the empty string,\nwhich is a substring of every page, so an ungrounded finding validates.\nIt counts as caught if the review names an empty or whitespace-only quote matching any source page in the grounding check." },
]

[[case]]
id       = "6-r1"
input    = "Review PR 6 of baileyrd/MediBoard against base 866e4bd0c4cb65227c0da2e675ff931e6b6371d0 at head 5fc60c1cb4245172941758ef75880c20d87ca868. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "5fc60c1cb4245172941758ef75880c20d87ca868", base = "866e4bd0c4cb65227c0da2e675ff931e6b6371d0", ref = "refs/pull/6/head" }
checks   = [
  { judge = "K1: Re-ingest replaces page text under reviewed rows\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ningest/ingest.py:64-65,72-77. _upsert_pages replaces the source text before the\nreviewed-page guard runs. Re-ingesting changed text reports KEPT_REVIEWED but leaves a\nconfirmed quote paired with page text that no longer contains it.\nIt counts as caught if the review names page text being overwritten before (or regardless of) the reviewed-row guard, so reviewed evidence no longer matches its source." },
]
