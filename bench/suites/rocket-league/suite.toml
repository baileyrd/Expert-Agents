# Generated by `python3 -m bench suite rocket-league`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": [
        "index.crates.io",
        "static.crates.io"
      ]
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "1048-r1"
input    = "Review PR 1048 of Rusty-Mill/rusty_mill against base aa414575c7272aa99f81b510aece522eac07a492 at head 9a29bffdbc778999e4f4d2d00fe069612a53229d. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "9a29bffdbc778999e4f4d2d00fe069612a53229d", base = "aa414575c7272aa99f81b510aece522eac07a492", ref = "refs/pull/1048/head" }
checks   = [
  { judge = "K1: Claimed linear sleep-threshold upper bound is not established by the recordings\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nfixture_checks.py:222-226 takes rest_80's final minimum speed (68.521 uu/s) as an upper bound\non the linear sleep threshold, and body.rs and the spec promote the interval (40.0, 68.5].\nThat ignores the 2 s dwell: a threshold of 70 still gives no sleep, since the speed crosses it\nonly near the end (72.911 two seconds before). And sleep needs linear and angular speed under\ntheir thresholds together; the angular threshold is only bounded above 0.438 while rest_80\nspins at 0.751 or more, so \"no sleep\" cannot bound the linear threshold alone.\nIt counts as caught if the review names the linear upper bound as unsupported because it ignores the dwell window or the joint linear/angular sleep condition (an unfrozen ball cannot bound one threshold alone)." },
]

[[case]]
id       = "666-r1"
input    = "Review PR 666 of Rusty-Mill/rusty_mill against base f3d03a936e7d9497b5ef315a5be8b30755aef689 at head fc3a6b0554faabb3baa647cdf2418a388ffb9b89. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "fc3a6b0554faabb3baa647cdf2418a388ffb9b89", base = "f3d03a936e7d9497b5ef315a5be8b30755aef689", ref = "refs/pull/666/head" }
checks   = [
  { judge = "K1: Startup ordering deadlocks the live runner against a menu-silent game\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nrb_rl_bridge.rs:175-194 waits for game traffic before printing \"serving bots on\".\nrl-lib.ps1:82-86 waits for that line, and run-live-test.ps1 loads the first map only after.\nThe game is silent in the menu, so startup times out at 300 s.\nIt counts as caught if the review names the readiness line now waiting on game traffic while the runner waits on that line before loading the map (the silent game never speaks)." },
  { judge = "K2: A ready game is evicted before its frame is checked\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nlink.rs:203-219: with the game queued first holding a complete valid frame, then eight\nsilent peers, the accept drain evicts the game for room before any candidate is inspected.\nIt counts as caught if the review names eviction of the oldest connection happening before waiting candidates are checked, so a game with a valid first frame can be dropped." },
  { judge = "K3: Unbounded accept drain starves candidate checks and the timeout\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nlink.rs:198-216 accepts until WouldBlock with no budget; a continuously replenished backlog\nkeeps the loop accepting, so no candidate is checked and the timeout never runs.\nIt counts as caught if the review names the accept loop draining until WouldBlock without a bound, starving checks or the timeout." },
  { judge = "K4: EOF behind buffered partial bytes is never detected\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nlink.rs:143-155 uses peek only. A peer that sends one header byte or part of a payload and\nthen closes stays \"waiting\" forever and keeps suppressing the idle timeout.\nIt counts as caught if the review names a connection with a partial frame then close staying waiting forever (peek cannot see EOF behind buffered bytes), blocking the timeout." },
  { judge = "K5: swap_remove breaks oldest-first eviction\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nlink.rs:226-228: rejecting the oldest junk with swap_remove moves the newest (possibly the\nsilent game) to index 0, so the next overflow evicts it while older peers remain.\nIt counts as caught if the review names swap_remove reordering the waiting list so oldest-first eviction drops the wrong (newer) connection." },
]

[[case]]
id       = "973-r1"
input    = "Review PR 973 of Rusty-Mill/rusty_mill against base 15296ea5bb670d14acb22df4f856fadec3e8280a at head 1f2ec4af1f652400ea4dda8e5093a121cdb86646. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "1f2ec4af1f652400ea4dda8e5093a121cdb86646", base = "15296ea5bb670d14acb22df4f856fadec3e8280a", ref = "refs/pull/973/head" }
checks   = [
  { judge = "K1: Rest probe cannot reach rest within its window\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ngen_probes.py:165-166: the ball launches at 600 uu/s and gets 1200 neutral ticks. The port\nseparates sliding from rolling and rolling decays only ~3%/s (ball damping 0.03), so the ball\nis still far above any candidate sleep speed when the probe ends. Parsing and running the\nprobe is not evidence it reaches rest; it needs a controlled low-speed, low-spin start with\nenough dwell, a predicted trajectory, and the 60 settle ticks counted as motion, not a hold.\nIt counts as caught if the review names that the rest probe's starting speed and duration leave the ball rolling well above the sleep threshold, so it cannot measure rest." },
  { judge = "K2: Probe omits angular_velocity, leaving spin uncontrolled and inconsistent\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nThe probes set no angular_velocity. The tape bot leaves an omitted spin unchanged from the\nprevious state, while Scenario::initial_frame defaults it to zero, so the game run and the\nport run start from different spins: an uncontrolled variable in a probe of sleep, which\ndepends on spin.\nIt counts as caught if the review names the unset angular_velocity, and that the tape bot and Scenario::initial_frame treat an omitted spin differently (keep vs zero)." },
]

[[case]]
id       = "999-r1"
input    = "Review PR 999 of Rusty-Mill/rusty_mill against base 712c1c2275f6898009357365175a2498f291dadb at head fd33e2baa3e8862cefdac4e670fa3475d0f2f4e2. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "fd33e2baa3e8862cefdac4e670fa3475d0f2f4e2", base = "712c1c2275f6898009357365175a2498f291dadb", ref = "refs/pull/999/head" }
checks   = [
  { judge = "K1: Unbounded recursion through nested ArrayProperty/StructProperty\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nheader.rs properties/property recurse through ArrayProperty rows (~158) and StructProperty\nfields (177-180) with no nesting limit. A CRC-valid replay with deeply nested structs or\narrays exhausts the stack instead of returning an Error, and catch_unwind does not recover\na stack overflow. Needs one depth budget shared by arrays and structs, a structured error\nwith the offset, and public-parse tests at and above the limit.\nIt counts as caught if the review names unbounded recursion on nested header properties (array or struct) letting a crafted replay overflow the stack." },
]
