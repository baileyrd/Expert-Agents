# Generated by `python3 -m bench suite conhost`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": []
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "1246-r1"
input    = "Review PR 1246 of Rusty-Mill/rusty_mill against base 66f4bc38c8181fd669c58f8e34df385a6afa895e at head 197fae02607fa8c4428614aef7a4e7ac1b5bca7f. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "197fae02607fa8c4428614aef7a4e7ac1b5bca7f", base = "66f4bc38c8181fd669c58f8e34df385a6afa895e", ref = "refs/pull/1246/head" }
checks   = [
  { judge = "K1: Cooked echo bypasses output backpressure\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nCooked reads build an unbounded echo and push it without the write budget. 60 waiting\ncooked reads prefilled with 8,192 units, cleared by win32 Escape plus CR in one slice,\nqueue 1,474,680 bytes against a documented 144 KiB maximum.\nIt counts as caught if the review names echo (not only input admission) as able to exceed the output budget in one handle call." },
  { judge = "K2: A trailing ESC at an input-slice boundary is decided as the Escape key\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nThe engine cuts the byte queue into 16 KiB slices without key or write boundaries. A\nsequence split right after ESC becomes Escape plus literal bytes; in cooked input that\ncan clear the line.\nIt counts as caught if the review names the slice or read boundary right after ESC turning a sequence into Escape plus text." },
  { judge = "K3: UTF-16 surrogate pairs are converted one unit at a time\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nCooked echo, raw ANSI reads, ANSI records and win32-input-mode to VT each convert one\nunit at a time, so U+1F600 becomes two U+FFFD even when both halves arrive together.\nIt counts as caught if the review names the per-unit conversion in at least two of the three paths (echo, ANSI reads, vt_for); one path is partial." },
]

[[case]]
id       = "1246-r2"
input    = "Review PR 1246 of Rusty-Mill/rusty_mill against base 66f4bc38c8181fd669c58f8e34df385a6afa895e at head 8ec54b85a08dc6e0a57e2bafde91952c839dcf18. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of 197fae02; re-check each at this head:\n- K1 (P1): Cooked echo bypasses output backpressure\n- K2 (P2): A trailing ESC at an input-slice boundary is decided as the Escape key\n- K3 (P2): UTF-16 surrogate pairs are converted one unit at a time"
checkout = { from = "${TARGET}", head = "8ec54b85a08dc6e0a57e2bafde91952c839dcf18", base = "66f4bc38c8181fd669c58f8e34df385a6afa895e", ref = "refs/pull/1246/head" }
checks   = [
  { judge = "K1: All full read replies are built before any is completed\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nserve_reads appends every reply to one effects vector, freed only when Console::handle\nreturns. 64 raw ReadConsoleW calls declaring 1 MiB each, fed one 10,260-byte slice of\nrepeat-65535 win32 records, hold about 64 MiB at once against design §7.4's one 1 MiB reply.\nIt counts as caught if the review names reply buffers accumulating across reads within one handle call beyond the §7.4 reply budget." },
  { judge = "K2: Write boundaries are lost when completed writes coalesce\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ntake_input's end flag is true only when the lane empties. write(ESC) then write(x), both\ndone before a drain, decode as Alt+x; drained between, as Escape then x.\nIt counts as caught if the review names two completed writes coalescing so a lone-ESC write is decoded differently by scheduling." },
]

[[case]]
id       = "1246-r3"
input    = "Review PR 1246 of Rusty-Mill/rusty_mill against base 66f4bc38c8181fd669c58f8e34df385a6afa895e at head 615e082460958ae36fbe19aaf705bc6898e70f5c. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of 8ec54b85; re-check each at this head:\n- K1 (P1): All full read replies are built before any is completed\n- K2 (P2): Write boundaries are lost when completed writes coalesce"
checkout = { from = "${TARGET}", head = "615e082460958ae36fbe19aaf705bc6898e70f5c", base = "66f4bc38c8181fd669c58f8e34df385a6afa895e", ref = "refs/pull/1246/head" }
checks   = [
  { judge = "K1: The engine waits on a poll decision made before the turn's events\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nThe wait deadline comes from plan.poll, computed before events run. A last slice that\nleaves reads_ready set, or an ESC write-end cut that leaves input queued, then waits with\nno timeout; the waker is auto-reset and already consumed, so the remainder can stall.\nIt counts as caught if the review names the stale pre-event poll plan with either the reads_ready or the leftover-input case." },
]

[[case]]
id       = "1246-r4"
input    = "Review PR 1246 of Rusty-Mill/rusty_mill against base 66f4bc38c8181fd669c58f8e34df385a6afa895e at head 2dfc3a6cd2136d98065b031cf0f65601568dcbd7. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of 615e0824; re-check each at this head:\n- K1 (P2): The engine waits on a poll decision made before the turn's events"
checkout = { from = "${TARGET}", head = "2dfc3a6cd2136d98065b031cf0f65601568dcbd7", base = "66f4bc38c8181fd669c58f8e34df385a6afa895e", ref = "refs/pull/1246/head" }
checks   = [
  { judge = "K1: Driver admission is not rearmed when input frees capacity\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nsubmit_read comes from the pre-event view. At MAX_WAITING with no READ_IO in flight, a\nslice that completes the reads reopens admission, but must_poll is false and the engine\nblocks without arming READ_IO, so later client requests cannot wake it.\nIt counts as caught if the review names admission reopening during the turn without READ_IO being armed before the wait." },
]
