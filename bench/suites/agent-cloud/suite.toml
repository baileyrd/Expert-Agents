# Generated by `python3 -m bench suite agent-cloud`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": [
        "index.crates.io",
        "static.crates.io"
      ]
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "14-r1"
input    = "Review PR 14 of baileyrd/agent_cloud against base e51a23df087ca9d9c056fd8727da71ba1b76cbc1 at head bb1b6b382b44cb29d430f9bcfefb70881a556cc7. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "bb1b6b382b44cb29d430f9bcfefb70881a556cc7", base = "e51a23df087ca9d9c056fd8727da71ba1b76cbc1", ref = "refs/pull/14/head" }
checks   = [
  { judge = "K1: Paths under btrfs send's temporary directory names are listed raw\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nchanges::paths drops only a path whose own name is a temporary o<ino>-<gen>-<seq> name.\nbtrfs send writes a new directory's files under its temporary name before renaming the\ndirectory into place, and renames a removed directory away before unlinking its files.\nSo a job's note lists its own result files as o2192-198662-0/result.txt, and the\nrunner's .jobs files escape the filter meant to hide them.\nIt counts as caught if the review names files under a temporary o<ino>-<gen>-<seq> directory (written before, or unlinked after, the directory's rename) being reported under the temporary name instead of the real one, or escaping the .jobs filter." },
]

[[case]]
id       = "19-r1"
input    = "Review PR 19 of baileyrd/agent_cloud against base b9f9532a759da13b69cdb549ee3cd163fac1c42e at head 69fe6877ddec11081fb131f2bbe2a8e76eb4f277. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "69fe6877ddec11081fb131f2bbe2a8e76eb4f277", base = "b9f9532a759da13b69cdb549ee3cd163fac1c42e", ref = "refs/pull/19/head" }
checks   = [
  { judge = "K1: limits-test treats every running sandbox as empty: cgroupfs files report size 0\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nlimits-test.sh checks the sandbox cgroup with [ -s \"$CG/cgroup.procs\" ]. cgroupfs files\nreport size 0, so the test is false for a running sandbox and the script reports\n\"no processes\" on a correctly limited agent.\nIt counts as caught if the review names the [ -s cgroup.procs ] size test being false on cgroupfs (size 0) so a populated cgroup is reported empty." },
  { judge = "K2: limits-test exits silently when memory.events has no matching line\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nThe script runs under set -euo pipefail. grep on memory.events returns 1 when no oom,\noom_kill or max line matches (or the file is missing), so the pipeline fails and the\nscript ends with no message and no verdict.\nIt counts as caught if the review names the memory.events grep failing under pipefail (no match or missing file) and ending the script without a message." },
  { judge = "K3: Restoring the configured disk limit builds '50G50' and leaves the trial limit\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nAfter the disk test the script restores the limit with\n\"${configured:+${configured}G}${configured:-none}\". When AC_AGENT_DISK_GIB is set both\nexpansions fire (50G then 50), btrfs qgroup limit rejects '50G50', and the agent keeps\nthe small trial limit. The restore also does not run if the script exits early.\nIt counts as caught if the review names the restore argument concatenating both expansions when a limit is configured (e.g. 50G50), so the trial limit stays, or the restore being skipped on an early exit." },
  { judge = "K4: Docs set AC_AGENT_DISK_GIB before quotas are enabled, so every create and resume fails\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nA disk limit with quotas off fails the boot by design (ADR-023), but install.md and\ngateway.env present the limit first and enable simple quotas only through the test\nscript run against an already running agent. Following the docs in order, every create\nand resume fails until quotas are on.\nIt counts as caught if the review names the install order: setting AC_AGENT_DISK_GIB with simple quotas still off makes every create and resume fail, so quotas must be enabled first." },
]
