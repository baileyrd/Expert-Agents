# Generated by `python3 -m bench suite remind-me`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": [
        "index.crates.io",
        "static.crates.io"
      ]
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "343-r1"
input    = "Review PR 343 of Rusty-Mill/rusty-remind-me against base d5528b1347054f348b3dac96f54619e603f4594c at head abdd0b76add2f3c5cf61cb1533f225405d53f931. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "abdd0b76add2f3c5cf61cb1533f225405d53f931", base = "d5528b1347054f348b3dac96f54619e603f4594c", ref = "refs/pull/343/head" }
checks   = [
  { judge = "K1: Overlapping prefixed-token matches panic in replace()\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nredact.rs:136-148. \"sk-<32 a>-sk-<32 b>\" matches (0,71) and (36,71): the first run swallows\nthe second prefix, which still matches after the hyphen. replace() slices text[71..36] and\npanics at the write boundary. Same shape for nested glpat- and github_pat_ tokens.\nIt counts as caught if the review names overlapping or nested secret matches reaching replace() unsorted/uncoalesced, causing a panic or bad slice." },
  { judge = "K2: A card number next to other digits escapes redaction\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nredact.rs:225-246. The scanner greedily joins space-separated digit groups, so\n\"4111111111111111 12/30\" becomes an 18-digit candidate that fails length validation and\nthe PAN is stored unredacted. Two adjacent card numbers fail the same way.\nIt counts as caught if the review names a valid card number left unredacted because neighbouring digits (expiry, a second card) join its candidate." },
]

[[case]]
id       = "343-r2"
input    = "Review PR 343 of Rusty-Mill/rusty-remind-me against base d5528b1347054f348b3dac96f54619e603f4594c at head 9ef2ec3a6eaf1fd7fe8b6edd6da5bad0f77337bb. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of abdd0b76; re-check each at this head:\n- K1 (P1): Overlapping prefixed-token matches panic in replace()\n- K2 (P2): A card number next to other digits escapes redaction"
checkout = { from = "${TARGET}", head = "9ef2ec3a6eaf1fd7fe8b6edd6da5bad0f77337bb", base = "d5528b1347054f348b3dac96f54619e603f4594c", ref = "refs/pull/343/head" }
checks   = [
  { judge = "K1: A later word-adjacent digit group cancels card redaction for the whole run\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nredact.rs:249-251 checks the boundary once per separated-digit run. In\n\"4111111111111111 12months\" the trailing \"m\" touches the last group, so cards_in never\nruns and the independently bounded PAN stays unredacted.\nIt counts as caught if the review names the boundary check applied per digit run rather than per candidate window, letting a trailing word-adjacent group leave a card unredacted." },
]

[[case]]
id       = "344-r1"
input    = "Review PR 344 of Rusty-Mill/rusty-remind-me against base d5528b1347054f348b3dac96f54619e603f4594c at head 95528f017e2db1caef65aeee2154995333588067. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "95528f017e2db1caef65aeee2154995333588067", base = "d5528b1347054f348b3dac96f54619e603f4594c", ref = "refs/pull/344/head" }
checks   = [
  { judge = "K1: The sync outbox carries the new evidence but the old weight\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\napply_merges (consolidation.rs ~501-526): set_merged stamps updated_at and queues the\ncanonical before Feedback::set_importance writes the boosted base_weight, which does not\nmove updated_at and so is never queued. Peers get metadata.evidence with the old weight,\nand a later merge there divides by an evidence factor it never received.\nIt counts as caught if the review names the merged canonical being queued for sync before its boosted weight is written, so peers receive evidence and weight that disagree." },
]

[[case]]
id       = "346-r1"
input    = "Review PR 346 of Rusty-Mill/rusty-remind-me against base d5528b1347054f348b3dac96f54619e603f4594c at head 8c7e55a64821d8f411b8578d76dfa81c4b43b3b8. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "8c7e55a64821d8f411b8578d76dfa81c4b43b3b8", base = "d5528b1347054f348b3dac96f54619e603f4594c", ref = "refs/pull/346/head" }
checks   = [
  { judge = "K1: A malformed index falls back to array position\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nembedder.rs:480-483 uses .get(\"index\").and_then(as_u64).map_or(position, ..), so a missing,\nnull, string, fractional or negative index is taken as the entry's position. A one-item\nresponse with index -1 is accepted, and reordered malformed entries attach vectors to the\nwrong inputs.\nIt counts as caught if the review names an invalid or missing response index being accepted (defaulting to position) instead of rejected, risking vectors attached to the wrong input." },
  { judge = "K2: Chunked embeddings responses are not decoded\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nThe shared post_json parser does not decode Transfer-Encoding: chunked, so a valid chunked\nresponse fails JSON parsing in the new backend. The review asked to support it or document\nthe restriction; it gave no grade (\"transport compatibility note\").\nIt counts as caught if the review names the hand-rolled HTTP client not handling chunked transfer encoding for the embeddings response." },
]

[[case]]
id       = "346-r2"
input    = "Review PR 346 of Rusty-Mill/rusty-remind-me against base d5528b1347054f348b3dac96f54619e603f4594c at head 9daba9f88644bffd4c41612121cf5e1eeccda7e5. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of 8c7e55a6; re-check each at this head:\n- K1 (P2): A malformed index falls back to array position\n- K2 (blocking): Chunked embeddings responses are not decoded"
checkout = { from = "${TARGET}", head = "9daba9f88644bffd4c41612121cf5e1eeccda7e5", base = "d5528b1347054f348b3dac96f54619e603f4594c", ref = "refs/pull/346/head" }
checks   = [
  { judge = "K1: dechunk accepts a body truncated after the zero-size chunk\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nembedder.rs:384-385 returns success on reading the zero-size chunk line, so a body ending\nin \"0\\r\\n\" without the final CRLF, or with an incomplete trailer section, is accepted\ndespite the documented rejection of truncated responses.\nIt counts as caught if the review names the chunk decoder succeeding at the last-chunk line without requiring the trailer section's terminating CRLF." },
]
