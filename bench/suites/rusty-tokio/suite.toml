# Generated by `python3 -m bench suite rusty-tokio`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": [
        "index.crates.io",
        "static.crates.io"
      ]
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "1066-r1"
input    = "Review PR 1066 of Rusty-Mill/rusty_mill against base 9248ea8d51bb91cfe134ab3638b939fb2780141f at head b6a9c9f6a6d240a355aede951e3e466f03ce3402. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "b6a9c9f6a6d240a355aede951e3e466f03ce3402", base = "9248ea8d51bb91cfe134ab3638b939fb2780141f", ref = "refs/pull/1066/head" }
checks   = [
  { judge = "K1: Cancelled waiters and replaced wakers are destroyed while the state lock is held\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nThe new cancellation cleanup drops waiters under the primitive's state lock (Mutex\ndequeue; Semaphore Claim::drop retain), and waker refresh drops the old Waker under the\nlock too. A Waker's last Arc drop runs user code: a Wake impl whose Drop calls\nadd_permits(1) (or Mutex::try_lock) is queued as the only reference, the acquire future\nis dropped, retain destroys the Waker while holding sem.state, and add_permits deadlocks\non the non-reentrant lock.\nIt counts as caught if the review names a Waker (removed on cancel or replaced on refresh) being dropped while the Mutex/Semaphore state lock is held, so a waker destructor that re-enters the primitive deadlocks." },
]

[[case]]
id       = "1066-r2"
input    = "Review PR 1066 of Rusty-Mill/rusty_mill against base 9248ea8d51bb91cfe134ab3638b939fb2780141f at head 3280c75ee19d93750bd973ee39f1d1dbf140a6cd. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of b6a9c9f6; re-check each at this head:\n- K1 (P2): Cancelled waiters and replaced wakers are destroyed while the state lock is held"
checkout = { from = "${TARGET}", head = "3280c75ee19d93750bd973ee39f1d1dbf140a6cd", base = "9248ea8d51bb91cfe134ab3638b939fb2780141f", ref = "refs/pull/1066/head" }
checks   = [
  { judge = "K1: Mutex release clones the next waiter's Waker under the state lock\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nMutex release/pass-on now calls next_waker, which clones the queued Waker while holding\nstate; the base moved the popped Waker out without cloning. A valid Arc-backed RawWaker\nwhose clone callback calls this mutex's try_lock (armed after enqueue) deadlocks when\nthe guard is released: release holds state, clone re-enters try_lock.\nIt counts as caught if the review names a Waker clone (a RawWaker callback) run while the Mutex/Semaphore state lock is held on the release or handoff path, so a clone callback that re-enters deadlocks." },
]

[[case]]
id       = "1085-r1"
input    = "Review PR 1085 of Rusty-Mill/rusty_mill against base 0beaf37853b445cb8e2a09485029f0d982d53d77 at head 349b521ab20b790caa53174a1b802057d30237ea. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "349b521ab20b790caa53174a1b802057d30237ea", base = "0beaf37853b445cb8e2a09485029f0d982d53d77", ref = "refs/pull/1085/head" }
checks   = [
  { judge = "K1: watch wait_for runs the predicate under the channel lock, so a panic poisons it\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nwatch::Receiver::wait_for (watch.rs:191-192) calls the user predicate while the shared\nStdMutex guard is held. If it unwinds, later send/borrow/changed panic at\nlock().unwrap(), and handle Drop unwraps the same lock, risking a double panic. Tokio's\nwait_for contract says a predicate panic does not poison the channel.\nIt counts as caught if the review names the wait_for predicate running while the watch lock is held, so a predicate panic poisons the channel (later lock().unwrap() or Drop panics)." },
  { judge = "K2: wait_for inspects a rejected version twice\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nwait_for (watch.rs:191-197) marks a version seen only when the predicate matches. With a\nvalue sent before wait_for starts, the predicate returns false, changed() returns\nimmediately for the same version, and the FnMut predicate runs again on it without a new\nsend. Tokio marks the version seen before calling the predicate.\n(Raised in https://github.com/Rusty-Mill/rusty_mill/pull/1085#issuecomment-6404587377.)\nIt counts as caught if the review names wait_for re-running the predicate on a version it already rejected because seen is updated only on a match." },
  { judge = "K3: Stdout poll_flush is a no-op, so a small LSP response can sit in std's line buffer\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nServer::stdio now uses rusty_tokio::io::Stdout (server.rs:96-103), whose poll_flush is a\nno-op (stdio.rs:142-147); writes go through std stdout's line buffer and are never\nflushed. An LSP frame ends in compact JSON with no newline, so a client waiting for the\ninitialize response can wait forever.\n(Raised in https://github.com/Rusty-Mill/rusty_mill/pull/1085#issuecomment-6404590715.)\nIt counts as caught if the review names rusty_tokio Stdout's poll_flush not flushing std stdout, so a response without a trailing newline stays buffered." },
  { judge = "K4: A dropped watch changed() wait leaves its waker registered\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nserver.rs:435-450 makes a new writer_dead.changed() future each select iteration. The\nwatch changed helper registers a cloned waker in shared state and dropping the future\ndoes not remove it, so while incoming messages keep winning the select, registrations\ngrow for the connection's lifetime. tokio's watch unregisters on drop. Raised as a\n\"migration concern\" without a P grade.\n(Raised in https://github.com/Rusty-Mill/rusty_mill/pull/1085#issuecomment-6404598606.)\nIt counts as caught if the review names watch changed() registrations not removed when the wait future is dropped, so repeated cancelled waits (e.g. a losing select! arm) accumulate wakers." },
]

[[case]]
id       = "1085-r2"
input    = "Review PR 1085 of Rusty-Mill/rusty_mill against base 0beaf37853b445cb8e2a09485029f0d982d53d77 at head 2a6e9dfda91768eb60bf11a3199b83a5000107ec. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of 349b521a; re-check each at this head:\n- K1 (P2): watch wait_for runs the predicate under the channel lock, so a panic poisons it\n- K2 (P2): wait_for inspects a rejected version twice\n- K3 (P1): Stdout poll_flush is a no-op, so a small LSP response can sit in std's line buffer\n- K4 (blocking): A dropped watch changed() wait leaves its waker registered"
checkout = { from = "${TARGET}", head = "2a6e9dfda91768eb60bf11a3199b83a5000107ec", base = "0beaf37853b445cb8e2a09485029f0d982d53d77", ref = "refs/pull/1085/head" }
checks   = [
  { judge = "K1: A cancelled Stdout write keeps the lock, so a later flush or shutdown never completes\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nStdout::state keeps the Busy write future after poll_write returns Pending, holding the\nmutex guard across spawn_blocking(...).await (stdio.rs:150-151, 238-243). Cancelling the\nouter write does not drop it, and poll_flush polls only its own flush future, which waits\non the same mutex without driving the retained write. Flush/shutdown can stay pending\nafter the OS write finishes; a cancelled flush followed by write is symmetric.\nIt counts as caught if the review names a cancelled Stdout write (or flush) whose retained operation holds the lock while the other operation never drives it, so flush/shutdown (or write) hangs." },
  { judge = "K2: A dropped watch changed() wait still leaves its waker registered\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nRound 1's dropped-wait registration finding is unchanged at this head: each dropped\nchanged() future leaves its cloned waker in the channel's shared state.\nIt counts as caught if the review names watch changed() registrations not removed when the wait future is dropped." },
  { judge = "K3: The new rusty_lsp stdio test is not gated on the runtime feature\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ntests/stdio.rs imports LanguageServer and Server unconditionally, but lib.rs exports them\nonly with feature runtime; the other runtime tests use required-features. A\n--no-default-features test or all-targets build fails.\n(Raised in https://github.com/Rusty-Mill/rusty_mill/pull/1085#issuecomment-6404669822.)\nIt counts as caught if the review names the stdio integration test missing required-features = [\"runtime\"] (or a cfg), breaking no-default-features builds." },
]

[[case]]
id       = "1226-r1"
input    = "Review PR 1226 of Rusty-Mill/rusty_mill against base 31c15429f115c0d6a8943ef797a1f750f4786176 at head aba661f23e2bda22c2d2e9340700d7fa72557239. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "aba661f23e2bda22c2d2e9340700d7fa72557239", base = "31c15429f115c0d6a8943ef797a1f750f4786176", ref = "refs/pull/1226/head" }
checks   = [
  { judge = "K1: install_fallback documents thread-spawn failure as an Err, but it panics\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ninstall_fallback() says it returns an error when a thread cannot be spawned and that a\nlater call retries. Builder::build_single() calls Reactor::start(), TimerDriver::start()\nand worker::spawn_worker(), whose thread spawns are .expect()ed, so thread exhaustion\npanics, and threads already started keep running, so a retry is not clean.\nIt counts as caught if the review names install_fallback's Errors contract being false: thread-spawn failure panics via expect (and partial startup leaves threads), so the io::Result/retry promise does not hold." },
  { judge = "K2: I/O entry points still say they always panic outside a runtime\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nAfter install_fallback succeeds, I/O constructors work outside a running Runtime, but\ntheir # Panics sections still say they panic there. The review asked to update them as\npart of the contract correction (Codex graded it P3).\nIt counts as caught if the review names the # Panics docs on I/O (or spawn) entry points being stale once a fallback is installed." },
]

[[case]]
id       = "1250-r1"
input    = "Review PR 1250 of Rusty-Mill/rusty_mill against base d05170b8cc082cffaf6c348411e82bea84b9632d at head 98621f936d802e1fb05912e47f1b569eebe230c9. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "98621f936d802e1fb05912e47f1b569eebe230c9", base = "d05170b8cc082cffaf6c348411e82bea84b9632d", ref = "refs/pull/1250/head" }
checks   = [
  { judge = "K1: A Notified dropped between dequeue and fire loses a notify_one\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nnotify_one and notify_last remove the waiter, unlock, and only then set single in fire.\nA waiter dropped in that window is out of the queue with single == false, so its drop\nneither forwards nor banks the notification and the notifier wakes a dead waiter; the\nnew forwarding path has the same gap. Two enabled waiters, notify_one on another\nthread, the first dropped concurrently: the second stays pending. (Codex review, P1.)\nIt counts as caught if the review names the window where a waiter has been dequeued by notify_one/notify_last (or forwarding) but single is not yet set, so dropping it then loses the notification." },
]
