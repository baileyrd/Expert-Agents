# Generated by `python3 -m bench.fix suite rusty-tokio`; edit the cases or prompt, not this.

samples       = 3
allowed_tools = ["Read", "Grep", "Glob", "Bash", "Edit", "Write"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Agent",
      "Read(/${EXPERT_AGENTS}/**)",
      "Edit(/${EXPERT_AGENTS}/**)",
      "Write(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Edit(/${TARGET}/**)",
      "Write(/${TARGET}/**)",
      "Read(~/.claude/**)",
      "Edit(~/.claude/**)",
      "Write(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": [
        "index.crates.io",
        "static.crates.io"
      ]
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "abort-poll-race"
input    = "Bug: in rusty_tokio, `JoinHandle::abort()` racing a task's transition from queued to running\ncan lose the cancellation.\n\nSymptoms under an abort/join stress loop (spawn many tasks, abort each from another\nthread while the runtime polls them, await every `JoinHandle`): occasionally a panic\nfrom the task state machine outside the future's poll, so the panic handler does not\ncatch it and the join never completes; and a task aborted before its first poll on the\ncurrent-thread runtime or a `LocalSet` does not always finish its join as cancelled.\n\nExpected, as in tokio: every aborted task's join completes exactly once with `Ok` or a\ncancelled `JoinError`, the future is dropped exactly once, and no panic escapes. Fix it\nin `crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 698844212a77722ea15d47cc37160caf1371f153; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "698844212a77722ea15d47cc37160caf1371f153" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "mpsc-cancelled-send"
input    = "Bug: in rusty_tokio's bounded `mpsc`, a cancelled `send` or `reserve` that was waiting for\ncapacity can leave a live sender parked forever.\n\nTrace: `mpsc::channel(1)` holding one value. Sender A calls `send(x)` and is polled to\n`Pending`; sender B does the same. A's future is then dropped (a timeout or a losing\n`select!` arm). The receiver takes the value, so capacity is free, but B is never woken\nand stays `Pending`. The same happens with `reserve()`, and when A had already been woken\nbefore it was dropped. Re-polling a waiting send with a fresh waker should not queue it\na second time.\n\ntokio's contract: dropping a waiting send/reserve removes it from the wait queue, and a\nwakeup it already received is not lost. Fix it in `crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 4c12777ab0a065e418958ce3a6efa2458de1612f; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "4c12777ab0a065e418958ce3a6efa2458de1612f" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "mpsc-waker-under-lock"
input    = "Bug: rusty_tokio's `mpsc` deadlocks when a task's `Waker` owns a `Sender` of the same channel.\n\nTrace: a task waits in `send`, `reserve` or `recv` with a waker whose `Arc` holds the\nlast clone of a `Sender` (or one of several; any `Sender` clone does). The waiting future\nis cancelled, re-polled with a different waker, or completes, or a `recv` is re-polled\nwith a new waker. When the channel then destroys the old waker, `Sender::drop` runs, and\nthe thread hangs: it never returns.\n\nA waker can own anything; destroying one must not hang the channel. Fix it in\n`crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 7096ee85c91de9ed4ca0eb1f17ad276e32ff9664; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "7096ee85c91de9ed4ca0eb1f17ad276e32ff9664" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]

[[case]]
id       = "rwlock-queue"
input    = "Bug: rusty_tokio's `RwLock` can deadlock.\n\nTrace 1: a write guard is held. A reader calls `read()` and is polled to `Pending`, then a\nsecond writer calls `write()` and is polled to `Pending`. When the first write guard is\ndropped, neither the reader nor the second writer ever acquires: both stay `Pending`\nwith the lock free.\n\nTrace 2: a `write()` future dropped while it is queued behind a held lock stays in the\nqueue for good, so readers that arrive later never acquire after the lock is released.\n\ntokio's `RwLock` is fair (FIFO) and its waiters are cancel safe. Fix it in\n`crates/libs/async/rusty_tokio`.\n\nBench mode. The working directory is a checkout of Rusty-Mill/rusty_mill at 6c09ab3cf96e7b4c14e523fc3f557cd073cabb11; treat that commit as\n`origin/main` and your base. There is no GitHub access: you cannot push, open a PR or run\nthe reviewer subagent, so skip the \"Independent review\" and \"Open the PR\" steps and leave\nyour change uncommitted in the working tree. Do everything else, then Return as the\nprompt says, with status **ready for PR**."
checkout = { from = "${TARGET}", head = "6c09ab3cf96e7b4c14e523fc3f557cd073cabb11" }
checks   = [{ any = [{ tool_called = "Edit" }, { tool_called = "Write" }] }]
