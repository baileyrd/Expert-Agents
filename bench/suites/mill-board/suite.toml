# Generated by `python3 -m bench suite mill-board`; edit the cases or prompt, not this.

samples       = 5
allowed_tools = ["Read", "Grep", "Glob", "Bash"]
timeout       = 3600
settings      = '''
{
  "permissions": {
    "deny": [
      "Edit",
      "Write",
      "NotebookEdit",
      "WebFetch",
      "WebSearch",
      "Read(/${EXPERT_AGENTS}/**)",
      "Read(/${TARGET}/**)",
      "Read(~/.claude/**)"
    ]
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "filesystem": {
      "denyRead": [
        "${EXPERT_AGENTS}",
        "${TARGET}",
        "~/.claude"
      ]
    },
    "network": {
      "allowedDomains": []
    }
  }
}
'''

[variant.baseline]
subject = "baseline.prompt.toml"
model   = "claude-opus-5-5"

[[case]]
id       = "1165-r1"
input    = "Review PR 1165 of Rusty-Mill/rusty_mill against base c4a0d031b437e9140d192f172838f4261da5b889 at head 453dd9f21e5c005b13f21d59fd30093af1bfbc01. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "453dd9f21e5c005b13f21d59fd30093af1bfbc01", base = "c4a0d031b437e9140d192f172838f4261da5b889", ref = "refs/pull/1165/head" }
checks   = [
  { judge = "K1: The removed MILL_BOARD_STORE binding is silently ignored\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nmain.rs:197-204: with the retired MILL_BOARD_STORE still set and no tick URL, a shipped\nunit starts an empty, healthy in-memory board whose writes are lost at restart.\nIt counts as caught if the review names a shipped configuration silently starting a memory board that loses writes." },
  { judge = "K2: The real-process tests were deleted with service.rs\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nFirst-admin credential confidentiality and real-process SIGTERM tests went with service.rs; restore them on a synthetic backend.\nIt counts as caught if the review names the lost first-admin confidentiality or SIGTERM process tests." },
  { judge = "K3: Store docs claim a card and its event become visible atomically\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nThe docs claim atomic, commit-ordered visibility; the tick HTTP commit precedes local event recording.\nIt counts as caught if the review names the doc claim against the commit-then-record order." },
]

[[case]]
id       = "1165-r2"
input    = "Review PR 1165 of Rusty-Mill/rusty_mill against base c4a0d031b437e9140d192f172838f4261da5b889 at head f680de2844fc492f52c0e9b08a57386ca3e062c0. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref.\n\nPrior findings, from the review of 453dd9f2; re-check each at this head:\n- K1 (P1): The removed MILL_BOARD_STORE binding is silently ignored\n- K2 (blocking): The real-process tests were deleted with service.rs\n- K3 (blocking): Store docs claim a card and its event become visible atomically"
checkout = { from = "${TARGET}", head = "f680de2844fc492f52c0e9b08a57386ca3e062c0", base = "c4a0d031b437e9140d192f172838f4261da5b889", ref = "refs/pull/1165/head" }
checks   = [
  { judge = "K1: Process-test children inherit board configuration and credentials\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\ntests/process.rs clears only six variables, so an inherited MILL_BOARD_GITHUB_CONFIG, or\nMILL_BOARD_GITHUB_REPO plus GITHUB_TOKEN, starts real sync, and MILL_BOARD_IDENTITIES\ncan create or read an external credentials file.\nIt counts as caught if the review names the child environment inheriting board config or credentials despite claimed isolation." },
]

[[case]]
id       = "1187-r1"
input    = "Review PR 1187 of Rusty-Mill/rusty_mill against base 55e5f3c65762cfd71c8f10883bcee20ea972ce7b at head 2017c08f1f83ab7a181b69574b354376f9ad5e2a. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "2017c08f1f83ab7a181b69574b354376f9ad5e2a", base = "55e5f3c65762cfd71c8f10883bcee20ea972ce7b", ref = "refs/pull/1187/head" }
checks   = [
  { judge = "K1: A restricted token's grant resolves to another credential with the same actor\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nby_actor (identities.rs:276-277) returns the first credential with an actor name, so a\nrestricted token's grant resolves to a duplicate and gains its role and projects.\nReview: https://github.com/Rusty-Mill/rusty_mill/pull/1187#pullrequestreview-5673783860\nIt counts as caught if the review names grant resolution by actor name picking a different, broader credential." },
  { judge = "K2: An IPv6 issuer's Host is bracketed differently by the two guards\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nThe web guard and the MCP guard bracket an IPv6 Host differently (issuer.rs:29-33), so\nmetadata and consent return 403. Review: https://github.com/Rusty-Mill/rusty_mill/pull/1187#pullrequestreview-5673796580\nIt counts as caught if the review names IPv6 Host bracketing disagreeing between the guards." },
  { judge = "K3: Two boards in one directory share the default oauth.json\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nmain.rs:168-178 defaults oauth.json by directory, so board A's grant is valid on board B.\nReview: https://github.com/Rusty-Mill/rusty_mill/pull/1187#pullrequestreview-5673834930\nIt counts as caught if the review names two boards sharing the default OAuth grant store." },
]

[[case]]
id       = "1238-r1"
input    = "Review PR 1238 of Rusty-Mill/rusty_mill against base d50375a25ced7622f88810e6d3bcad8f1986bb50 at head 43e0720953f356a5a1abec4fd4da8a6a9a3032a5. The working directory is a checkout of the head with history up to it, and its origin serves only the PR head ref."
checkout = { from = "${TARGET}", head = "43e0720953f356a5a1abec4fd4da8a6a9a3032a5", base = "d50375a25ced7622f88810e6d3bcad8f1986bb50", ref = "refs/pull/1238/head" }
checks   = [
  { judge = "K1: Number allocation is serialized by a process-local mutex\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nboard.rs:345-353 serializes allocation in-process; two boards on one rusty_tick both take max+1.\nIt counts as caught if the review names two board processes on one rusty_tick allocating the same number." },
  { judge = "K2: Numbers come from live cards only, so they can be reused\nPass if the review reports this known defect as one of its findings, even only in part\n(for example one of several affected paths). Wording does not matter; the defect does.\n\nboard.rs:326-331 derives numbers from Store::list(), so untag, trash or restore makes a\nlive card's number reusable, and lookup picks the first of duplicates instead of failing\nclosed.\nIt counts as caught if the review names reuse after trash, untag or restore, or lookup not failing closed on duplicates." },
]
