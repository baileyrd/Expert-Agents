task = """
Bug: in rusty_tokio, `io::BufReader` loses data. After a small read leaves bytes in its
buffer, a following read into a buffer at least as large as the `BufReader`'s capacity
skips the buffered bytes and returns later data.

Repro: `BufReader::with_capacity(4, &b"abcdefghij"[..])`; `read_exact` one byte (gets
`a`); then `read` into a 16-byte buffer returns `efghij`, and `bcd` is gone.

Expected, as in tokio: bytes come out in order and none are lost, whatever the read
sizes. Fix it in `crates/libs/async/rusty_tokio`.
"""
