task = """
Bug: in rusty_tokio, data written through `io::BufWriter` or `io::BufStream` is lost if
the stream is shut down without an explicit `flush()`. The peer sees EOF without the
buffered bytes.

Repro: wrap one half of `io::duplex(64)` in `BufWriter`, `write_all(b"hello")`, then
`shutdown()`. `read_to_end` on the other half returns nothing.

Expected, as in tokio: `shutdown()` writes out buffered data before shutting down the
inner stream. Fix it in `crates/libs/async/rusty_tokio`.
"""
