task = """
Bug: in rusty_tokio, `time::Interval` with `MissedTickBehavior::Skip` sometimes fires two
ticks back to back after a stall. When the caller falls behind by an exact multiple of the
period (easy to hit under `time::pause()` and `time::advance`), the tick after the
catch-up tick completes immediately instead of waiting.

Repro: `interval_at(start, 10s)` with Skip, tick once, advance 30s, tick (returns
`start + 10s`), then tick again: it returns `start + 30s` at once.

Expected, as in tokio: Skip schedules the next tick strictly in the future, on the
original period grid (`start + 40s` here). Fix it in `crates/libs/async/rusty_tokio`.
"""
