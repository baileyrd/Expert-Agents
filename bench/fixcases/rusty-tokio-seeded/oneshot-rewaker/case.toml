task = """
Bug: in rusty_tokio, a `oneshot::Receiver` that is polled in one place and later awaited
somewhere else can hang forever even though the `Sender` sends a value.

Repro: race `&mut rx` against `time::timeout` (or in a `select!` loop) so it is polled and
times out, then move `rx` into a spawned task and `.await` it there. Send from another task.
The spawned task never wakes. Awaiting `rx` from a single place works.

Expected, as in tokio: `send` wakes whichever task polled the receiver most recently, and
the await returns `Ok(value)`. Fix it in `crates/libs/async/rusty_tokio`.
"""
