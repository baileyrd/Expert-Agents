task = """
Bug: in rusty_tokio, a task blocked in `broadcast::Receiver::recv()` never returns after
the last `Sender` is dropped. In one service the shutdown path hung instead of finishing.

If `recv()` is called after every sender is already gone it correctly returns
`RecvError::Closed`; only a receiver that was already waiting is affected.

Expected, as in tokio: dropping the last sender wakes every waiting receiver, and each gets
`RecvError::Closed` once it has read what was buffered. Fix it in
`crates/libs/async/rusty_tokio`.
"""
