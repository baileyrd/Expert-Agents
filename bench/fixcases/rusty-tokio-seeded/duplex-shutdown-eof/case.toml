task = """
Bug: in rusty_tokio, reading from an `io::duplex` stream can hang after the peer calls
`shutdown()`. A task blocked in `read`/`read_to_end` on an empty pipe stays blocked when
the other half shuts down its write side.

Reads that start after the shutdown see EOF correctly, and dropping the other half
instead of shutting it down also wakes the reader.

Expected, as in tokio: `shutdown()` on one half makes a pending read on the other half
return EOF (`Ok(0)`) once the buffered bytes are drained. Fix it in
`crates/libs/async/rusty_tokio`.
"""
