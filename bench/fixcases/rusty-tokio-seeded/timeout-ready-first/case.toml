task = """
Bug: in rusty_tokio, `time::timeout` and `time::timeout_at` report `Err(Elapsed)` for a
future that is already complete when the deadline has passed by the time it is polled.

Repro: `timeout(Duration::ZERO, async { 5 }).await` returns `Err(Elapsed)`. Under paused
time, a future that becomes ready at the same instant as the deadline also loses.

Expected, as in tokio: a future that can complete returns `Ok(value)`; `Elapsed` only
when it is still pending at the deadline. Fix it in `crates/libs/async/rusty_tokio`.
"""
