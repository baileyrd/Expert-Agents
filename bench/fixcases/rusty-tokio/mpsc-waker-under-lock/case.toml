task = """
Bug: rusty_tokio's `mpsc` deadlocks when a task's `Waker` owns a `Sender` of the same channel.

Trace: a task waits in `send`, `reserve` or `recv` with a waker whose `Arc` holds the
last clone of a `Sender` (or one of several; any `Sender` clone does). The waiting future
is cancelled, re-polled with a different waker, or completes, or a `recv` is re-polled
with a new waker. When the channel then destroys the old waker, `Sender::drop` runs, and
the thread hangs: it never returns.

A waker can own anything; destroying one must not hang the channel. Fix it in
`crates/libs/async/rusty_tokio`.
"""
