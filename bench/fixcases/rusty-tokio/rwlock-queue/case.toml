task = """
Bug: rusty_tokio's `RwLock` can deadlock.

Trace 1: a write guard is held. A reader calls `read()` and is polled to `Pending`, then a
second writer calls `write()` and is polled to `Pending`. When the first write guard is
dropped, neither the reader nor the second writer ever acquires: both stay `Pending`
with the lock free.

Trace 2: a `write()` future dropped while it is queued behind a held lock stays in the
queue for good, so readers that arrive later never acquire after the lock is released.

tokio's `RwLock` is fair (FIFO) and its waiters are cancel safe. Fix it in
`crates/libs/async/rusty_tokio`.
"""
