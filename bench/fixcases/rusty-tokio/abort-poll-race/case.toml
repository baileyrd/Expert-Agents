task = """
Bug: in rusty_tokio, `JoinHandle::abort()` racing a task's transition from queued to running
can lose the cancellation.

Symptoms under an abort/join stress loop (spawn many tasks, abort each from another
thread while the runtime polls them, await every `JoinHandle`): occasionally a panic
from the task state machine outside the future's poll, so the panic handler does not
catch it and the join never completes; and a task aborted before its first poll on the
current-thread runtime or a `LocalSet` does not always finish its join as cancelled.

Expected, as in tokio: every aborted task's join completes exactly once with `Ok` or a
cancelled `JoinError`, the future is dropped exactly once, and no panic escapes. Fix it
in `crates/libs/async/rusty_tokio`.
"""
