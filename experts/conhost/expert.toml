# Source of truth for the conhost reviewer. Target repos receive copies (see sync/).
name = "conhost"
version = 1
source = "Rusty-Mill/rusty_mill PR #1257 at 0f3a30def4d2d7e849cdae1aba5f602f85384287"

[[prompt]]
file = "prompt.md"
kind = "claude-subagent"
target_repo = "Rusty-Mill/rusty_mill"
target_path = ".claude/agents/conhost-expert.md"

[[prompt]]
file = "codex.md"
kind = "codex"
target_repo = "Rusty-Mill/rusty_mill"
target_path = "docs/agents/reviewers/conhost-expert-codex.md"

# Sections by their "## " heading; "" is the text before the first heading.
# A required section is never ablated: it carries authority, pinning or the
# output contract the scorer depends on.
[[section]]
heading = ""
role = "persona"
required = false

[[section]]
heading = "Authority"
role = "authority"
required = true

[[section]]
heading = "Pin the review"
role = "pinning"
required = true

[[section]]
heading = "What to read"
role = "reading"
required = false

[[section]]
heading = "Two axes"
role = "defect-classes"
required = false

[[section]]
heading = "Evidence, strongest first"
role = "oracles"
required = false

[[section]]
heading = "Steps"
role = "steps"
required = false

# Holds the severity guidance too; split it out before ablating severity alone.
[[section]]
heading = "Findings"
role = "findings"
required = false

[[section]]
heading = "Checks"
role = "checks"
required = false

[[section]]
heading = "Return"
role = "return"
required = true
