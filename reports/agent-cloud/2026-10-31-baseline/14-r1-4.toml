[[finding]]
id = "F1"
severity = "P1"
title = "Change diff runs inline on the tick thread, lifecycle lock and pre-READY reconcile; output read unbounded"
triage = "real"
reason = "traced at head bb1b6b3: jobs.rs transition calls note_changes inline after the lock drops; main.rs runs jobs.reconcile() before READY and tick() on the single supervisor thread; dump read whole"

[[finding]]
id = "F2"
severity = "P2"
title = "A file the agent names like o<ino>-<gen>-<seq> has every change hidden"
triage = "real"
reason = "traced at head bb1b6b3: changes.rs note() drops any temp-shaped path for every command; its own doc comment says only where created or renamed to; runs executed the probe"

[[finding]]
id = "F3"
severity = "P2"
title = "security.md and ADR-010 still say history holds only job ids and states"
triage = "real"
reason = "traced at head bb1b6b3: docs/security.md:190 'history records only job ids and states'; the PR adds agent-chosen paths to history"

[[finding]]
id = "F4"
severity = "P2"
title = "Job snapshots a crash leaves behind are cleaned only by purge"
triage = "design_question"
reason = "ADR-019 at head: 'a purge deletes any a crash left behind' documents crash leftovers as intended; the purge-versus-diff race in the same finding is graded separately as F5"

[[finding]]
id = "F5"
severity = "P2"
title = "Purge can race a still-running job diff and fail with partial state"
triage = "real"
reason = "traced at head bb1b6b3: transition marks the job terminal and releases the lock before note_changes, so busy() is false and DELETE ?purge=true can run snap::purge while the diff creates <job>.end; purge lists job snapshots once, then remove_dir_if_present fails on the new subvolume. Rare (needs a purge during a diff); not executed"
